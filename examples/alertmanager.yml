# Exemplo de trecho de configuração. Ajuste URL e caminho do segredo ao ambiente.
route:
  receiver: incident-copilot
  group_by: [alertname, service]
  group_wait: 10s
  group_interval: 5m
  repeat_interval: 4h
receivers:
  - name: incident-copilot
    webhook_configs:
      - url: http://incident-copilot:8080/webhook/alertmanager
        send_resolved: true
        max_alerts: 20
        http_config:
          authorization:
            type: Bearer
            credentials_file: /run/secrets/incident_copilot_token

